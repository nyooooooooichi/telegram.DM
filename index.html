<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>TelestgramDM</title>
<style>
:root{--bg:#080b12;--panel:#0f1420;--panel2:#171e2d;--panel3:#1d2638;--text:#f7f8fb;--muted:#9aa4b6;--line:#263248;--accent:#6b7cff;--accent2:#805cff;--ok:#55d58a}
body.light{--bg:#eef2f7;--panel:#fff;--panel2:#f5f7fb;--panel3:#e9eef6;--text:#172033;--muted:#697386;--line:#d7deea}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}
.loginWrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 0%,rgba(107,124,255,.18),transparent 30%),radial-gradient(circle at 100% 0%,rgba(128,92,255,.14),transparent 30%),var(--bg)}
.card,.modal{background:var(--panel);border:1px solid var(--line);border-radius:24px}.card{width:min(460px,100%);padding:26px}.logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:900;font-size:26px;margin-bottom:16px}
.textInput{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:12px 13px;outline:none}.primary{width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;padding:13px;margin-top:12px}
.topbar{height:66px;position:sticky;top:0;z-index:20;background:rgba(8,11,18,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px}.groupInfo{display:flex;align-items:center;gap:10px}.groupAvatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:white;font-weight:900}.groupName{font-weight:850}.statusLine{font-size:12px;color:var(--ok)}.actions{display:flex;gap:6px}.iconBtn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text)}
.messages{width:min(940px,100%);margin:0 auto;padding:14px 12px 150px;display:flex;flex-direction:column;gap:12px}.daySep{align-self:center;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:999px}.unreadLine{display:flex;align-items:center;gap:8px;color:#ff7188;font-size:11px;font-weight:800}.unreadLine:before,.unreadLine:after{content:"";height:1px;background:#ff6178;flex:1}
.msgRow{display:flex;gap:8px;max-width:84%;align-items:flex-end}.msgRow.mine{align-self:flex-end;flex-direction:row-reverse}.msgRow.other{align-self:flex-start}.avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--panel3);display:grid;place-items:center;border:1px solid var(--line);font-size:12px;font-weight:800;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}.sender{font-size:11px;color:var(--muted);margin:0 6px 4px}.mine .sender{text-align:right}.bubble{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}.mine .bubble{background:linear-gradient(135deg,#6578ff,#775cff);border-color:transparent;color:white}.bubble a{color:#8ec5ff;text-decoration:underline}.mine .bubble a{color:white}.mentionTag{background:rgba(107,124,255,.22);border-radius:5px;padding:1px 3px;font-weight:700}.meta{font-size:10px;color:var(--muted);margin-top:4px;padding:0 6px}.mine .meta{text-align:right}
.composerShell{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(180deg,transparent,var(--bg) 28%);padding:28px 8px 8px}.composer{width:min(940px,100%);margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:8px;display:flex;gap:8px;align-items:flex-end}.messageInput{flex:1;min-width:0;max-height:120px;resize:none;border:0;background:transparent;color:var(--text);outline:none;padding:10px 8px}.sendBtn{width:45px;height:45px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:900}.scrollBtn{position:fixed;right:18px;bottom:112px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--text);z-index:28}
.modalBack{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.58);display:grid;place-items:center;padding:16px}.modal{width:min(480px,100%);max-height:84vh;overflow:auto;padding:18px}.modalHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.closeBtn{width:38px;height:38px;border:0;border-radius:12px;background:var(--panel2);color:var(--text)}.settingRow{padding:13px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.settingRow b{display:block}.settingRow span{font-size:12px;color:var(--muted)}.actionBtn{border:0;border-radius:11px;padding:9px 11px;background:var(--panel3);color:var(--text);font-weight:700}.danger{color:#ff8a9b!important}
.profileHead{display:flex;gap:14px;align-items:center;margin-bottom:16px}.profileBig{width:76px;height:76px;border-radius:50%;overflow:hidden;background:var(--panel3);display:grid;place-items:center;font-size:28px;font-weight:900;border:1px solid var(--line)}.profileBig img{width:100%;height:100%;object-fit:cover}.profileBio{color:var(--muted);font-size:13px;white-space:pre-wrap}
.member{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}.offlineDot{background:#6d7685}.mentionBox{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;max-height:220px;overflow:auto;min-width:220px}.mentionBox button{width:100%;border:0;background:transparent;color:var(--text);text-align:left;padding:9px;border-radius:9px}
@media(max-width:680px){.messages{padding:12px 9px 150px}.msgRow{max-width:92%}.topbar{height:62px;padding:0 8px}}
</style>
</head>
<body>
<section id="login" class="loginWrap">
 <div class="card"><div class="logo">T</div><h1>TelestgramDM</h1><p class="muted">表示名は最初の1回だけ設定します。</p><form id="loginForm"><input id="nameInput" class="textInput" maxlength="24" placeholder="表示名を入力" required><button class="primary">はじめる</button></form></div>
</section>

<section id="app" class="hidden">
<header class="topbar"><div class="groupInfo"><div class="groupAvatar">T</div><div><div id="roomNameEl" class="groupName">みんなのグループ</div><div id="onlineStatus" class="statusLine">● 接続中</div></div></div><div class="actions"><button id="membersBtn" class="iconBtn">👥</button><button id="profileBtn" class="iconBtn">👤</button><button id="settingsBtn" class="iconBtn">⚙️</button></div></header>
<main id="messages" class="messages"></main>
<button id="scrollBtn" class="scrollBtn">↓</button>
<div class="composerShell"><form id="messageForm" class="composer"><textarea id="messageInput" class="messageInput" maxlength="1000" rows="1" placeholder="メッセージ…"></textarea><button class="sendBtn">➤</button></form></div>
</section>

<div id="settingsModal" class="modalBack hidden"><div class="modal">
<div class="modalHeader"><h2 style="margin:0">設定</h2><button id="closeSettings" class="closeBtn">✕</button></div>
<div class="settingRow"><div><b>管理者コード</b><span>コードを入力して管理者モード</span></div><button id="adminCodeBtn" class="actionBtn">入力</button></div>
<div id="adminRoomRow" class="settingRow hidden"><div><b>ルーム名変更</b><span>管理者モードのみ</span></div><button id="renameRoomBtn" class="actionBtn">変更</button></div>
<div class="settingRow"><div><b>テーマ</b><span>黒 / 白</span></div><button id="themeBtn" class="actionBtn">切替</button></div>
<div class="settingRow"><div><b>キャッシュリセット</b><span>この端末の保存情報を削除</span></div><button id="cacheBtn" class="actionBtn danger">リセット</button></div>
</div></div>

<div id="profileModal" class="modalBack hidden"><div class="modal">
<div class="modalHeader"><h2 style="margin:0">プロフィール</h2><button id="closeProfile" class="closeBtn">✕</button></div>
<div class="profileHead"><div id="profileBig" class="profileBig">?</div><div><b id="profileName"></b><div id="profileLast" class="small muted"></div></div></div>
<div id="profileBio" class="profileBio"></div>
<div id="myProfileEdit" class="hidden">
<div class="settingRow"><div><b>プロフィール写真</b><span>小さく圧縮して保存</span></div><button id="avatarBtn" class="actionBtn">選ぶ</button></div>
<input id="avatarInput" type="file" accept="image/*" class="hidden">
<input id="profileNameInput" class="textInput" maxlength="24" placeholder="表示名" style="margin-top:12px">
<textarea id="bioInput" class="textInput" maxlength="120" style="min-height:90px;resize:vertical;margin-top:10px" placeholder="ひとこと"></textarea>
<button id="saveProfileBtn" class="primary">プロフィール保存</button>
</div>
</div></div>

<div id="membersModal" class="modalBack hidden"><div class="modal"><div class="modalHeader"><h2 style="margin:0">メンバー</h2><button id="closeMembers" class="closeBtn">✕</button></div><div id="membersList"></div></div></div>
<div id="mentionBox" class="mentionBox hidden"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyCrRzSomSPngvYviAjB8DdOSsw9ez0FVEg",authDomain:"telestgramdm.firebaseapp.com",projectId:"telestgramdm",storageBucket:"telestgramdm.firebasestorage.app",messagingSenderId:"705244166001",appId:"1:705244166001:web:1ca61eb8c3da30fb8528d0"};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),ROOM_ID="main-group",ADMIN_CODE_HASH="1b51c82b6956ef897f3eef0a9ba512d65291f5d3ea8dd71ed8ae37e191797720";
const $=s=>document.querySelector(s);
const login=$("#login"),app=$("#app"),loginForm=$("#loginForm"),nameInput=$("#nameInput"),messages=$("#messages"),messageForm=$("#messageForm"),messageInput=$("#messageInput"),scrollBtn=$("#scrollBtn");
const settingsModal=$("#settingsModal"),settingsBtn=$("#settingsBtn"),closeSettings=$("#closeSettings"),membersModal=$("#membersModal"),membersBtn=$("#membersBtn"),closeMembers=$("#closeMembers"),membersList=$("#membersList");
const profileModal=$("#profileModal"),profileBtn=$("#profileBtn"),closeProfile=$("#closeProfile"),profileBig=$("#profileBig"),profileName=$("#profileName"),profileLast=$("#profileLast"),profileBio=$("#profileBio"),myProfileEdit=$("#myProfileEdit"),avatarBtn=$("#avatarBtn"),avatarInput=$("#avatarInput"),profileNameInput=$("#profileNameInput"),bioInput=$("#bioInput"),saveProfileBtn=$("#saveProfileBtn");
const roomNameEl=$("#roomNameEl"),onlineStatus=$("#onlineStatus"),adminCodeBtn=$("#adminCodeBtn"),adminRoomRow=$("#adminRoomRow"),renameRoomBtn=$("#renameRoomBtn"),themeBtn=$("#themeBtn"),cacheBtn=$("#cacheBtn"),mentionBox=$("#mentionBox");
let me=null,myProfile=null,profiles=new Map(),docs=[],unreadCutoff=Number(localStorage.getItem("lastReadAt")||0),isAdmin=localStorage.getItem("adminMode")==="1",roomName="みんなのグループ";

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>').replace(/(^|\s)(@[\wぁ-んァ-ン一-龯ー]+)/g,'$1<span class="mentionTag">$2</span>')}
function avatarHTML(p){return p?.avatar?`<img src="${p.avatar}" alt="">`:esc((p?.name||"?").slice(0,1).toUpperCase())}
function ms(ts){try{return ts?.toMillis?.()||0}catch{return 0}}function d(ts){try{return ts?.toDate?.()||new Date()}catch{return new Date()}}
function fmtTime(ts){return d(ts).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}
function fmtLast(ts){const t=ms(ts);if(!t)return"最終オンライン不明";const diff=Date.now()-t;if(diff<95000)return"オンライン";if(diff<3600000)return`${Math.max(1,Math.floor(diff/60000))}分前にオンライン`;if(diff<86400000)return`${Math.floor(diff/3600000)}時間前にオンライン`;return d(ts).toLocaleDateString("ja-JP")+" にオンライン"}
async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

async function ensureProfile(n){const r=doc(db,"rooms",ROOM_ID,"profiles",me.uid),s=await getDoc(r);if(s.exists())myProfile=s.data();else{myProfile={uid:me.uid,name:n,bio:"",avatar:""};await setDoc(r,{...myProfile,lastSeen:serverTimestamp()})}localStorage.setItem("displayName",myProfile.name)}
async function enter(){login.classList.add("hidden");app.classList.remove("hidden");await loadRoom();startProfiles();startMessages();touch();setInterval(touch,40000)}
loginForm.onsubmit=async e=>{e.preventDefault();const n=nameInput.value.trim().slice(0,24);if(!n)return;localStorage.setItem("displayName",n);if(auth.currentUser){me=auth.currentUser;await ensureProfile(n);enter()}else await signInAnonymously(auth)}
onAuthStateChanged(auth,async u=>{if(!u)return;me=u;const saved=localStorage.getItem("displayName");if(saved){await ensureProfile(saved);enter()}else login.classList.remove("hidden")})
async function touch(){if(me)await setDoc(doc(db,"rooms",ROOM_ID,"profiles",me.uid),{lastSeen:serverTimestamp()},{merge:true})}

async function loadRoom(){const r=doc(db,"rooms",ROOM_ID,"config","main"),s=await getDoc(r);if(s.exists()&&s.data().roomName)roomName=s.data().roomName;roomNameEl.textContent=roomName;onSnapshot(r,x=>{if(x.exists()&&x.data().roomName){roomName=x.data().roomName;roomNameEl.textContent=roomName}})}
function startProfiles(){onSnapshot(collection(db,"rooms",ROOM_ID,"profiles"),snap=>{profiles.clear();snap.forEach(x=>profiles.set(x.id,x.data()));onlineStatus.textContent=`● ${[...profiles.values()].filter(p=>Date.now()-ms(p.lastSeen)<95000).length}人オンライン`;renderMessages();renderMembers()})}
function buildMessage(x){const m=x.data,p=profiles.get(m.uid)||{name:m.name||"匿名"},mine=m.uid===me?.uid,row=document.createElement("div");row.className="msgRow "+(mine?"mine":"other");row.innerHTML=`<div class="avatar" data-uid="${m.uid}">${avatarHTML(p)}</div><div><div class="sender">${esc(p.name||m.name||"匿名")}</div><div class="bubble">${linkify(m.text||"")}</div><div class="meta">${fmtTime(m.createdAt)}</div></div>`;row.querySelector(".avatar").onclick=()=>openProfile(m.uid);return row}
function renderMessages(){messages.innerHTML="";let lastDay="",unread=false;for(const x of docs){const day=d(x.data.createdAt).toLocaleDateString("ja-JP");if(day!==lastDay){const e=document.createElement("div");e.className="daySep";e.textContent=day;messages.appendChild(e);lastDay=day}if(!unread&&ms(x.data.createdAt)>unreadCutoff&&x.data.uid!==me?.uid){const u=document.createElement("div");u.className="unreadLine";u.textContent="ここから未読";messages.appendChild(u);unread=true}messages.appendChild(buildMessage(x))}}
function startMessages(){const q=query(collection(db,"rooms",ROOM_ID,"messages"),orderBy("createdAt","asc"),limit(100));onSnapshot(q,s=>{docs=s.docs.map(x=>({id:x.id,data:x.data()}));renderMessages();const last=docs.at(-1);if(last)localStorage.setItem("lastReadAt",String(ms(last.data.createdAt)))})}
messageForm.onsubmit=async e=>{e.preventDefault();const text=messageInput.value.trim();if(!text)return;messageInput.value="";await addDoc(collection(db,"rooms",ROOM_ID,"messages"),{text,name:myProfile.name,uid:me.uid,createdAt:serverTimestamp(),readBy:[me.uid]});scrollToBottom()}
function scrollToBottom(){window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}scrollBtn.onclick=scrollToBottom;

messageInput.oninput=()=>{const v=messageInput.value,m=v.match(/(?:^|\s)@([^\s@]*)$/);if(!m){mentionBox.classList.add("hidden");return}const q=m[1].toLowerCase(),arr=[...profiles.entries()].filter(([uid,p])=>uid!==me.uid&&(p.name||"").toLowerCase().includes(q)).slice(0,6);if(!arr.length){mentionBox.classList.add("hidden");return}mentionBox.innerHTML=arr.map(([uid,p])=>`<button data-name="${esc(p.name)}">@${esc(p.name)}</button>`).join("");const r=messageInput.getBoundingClientRect();mentionBox.style.left=Math.max(8,r.left)+"px";mentionBox.style.bottom=(innerHeight-r.top+8)+"px";mentionBox.classList.remove("hidden");mentionBox.querySelectorAll("button").forEach(b=>b.onclick=()=>{messageInput.value=v.replace(/(?:^|\s)@([^\s@]*)$/,x=>x.startsWith(" ")?" @"+b.dataset.name:"@"+b.dataset.name);mentionBox.classList.add("hidden");messageInput.focus()})}

function renderMembers(){const arr=[...profiles.entries()].sort((a,b)=>ms(b[1].lastSeen)-ms(a[1].lastSeen));membersList.innerHTML=arr.map(([uid,p])=>`<div class="member" data-uid="${uid}"><div class="dot ${Date.now()-ms(p.lastSeen)<95000?"":"offlineDot"}"></div><div class="avatar">${avatarHTML(p)}</div><div><b>${esc(p.name||"匿名")}</b><div class="small muted">${fmtLast(p.lastSeen)}</div></div></div>`).join("");membersList.querySelectorAll(".member").forEach(e=>e.onclick=()=>openProfile(e.dataset.uid))}
function openProfile(uid){const p=profiles.get(uid);if(!p)return;profileBig.innerHTML=avatarHTML(p);profileName.textContent=p.name||"匿名";profileLast.textContent=fmtLast(p.lastSeen);profileBio.textContent=p.bio||"ひとこと未設定";const mine=uid===me.uid;myProfileEdit.classList.toggle("hidden",!mine);if(mine){profileNameInput.value=p.name||"";bioInput.value=p.bio||""}profileModal.classList.remove("hidden")}
profileBtn.onclick=()=>openProfile(me.uid);closeProfile.onclick=()=>profileModal.classList.add("hidden");membersBtn.onclick=()=>membersModal.classList.remove("hidden");closeMembers.onclick=()=>membersModal.classList.add("hidden");

avatarBtn.onclick=()=>avatarInput.click();avatarInput.onchange=()=>{const f=avatarInput.files?.[0];if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=96;const ctx=c.getContext("2d"),s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;ctx.drawImage(img,sx,sy,s,s,0,0,96,96);myProfile.avatar=c.toDataURL("image/jpeg",.7);profileBig.innerHTML=avatarHTML(myProfile);URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f)}
saveProfileBtn.onclick=async()=>{const n=profileNameInput.value.trim().slice(0,24);if(!n)return alert("名前を入力してください");myProfile.name=n;myProfile.bio=bioInput.value.trim().slice(0,120);await setDoc(doc(db,"rooms",ROOM_ID,"profiles",me.uid),{name:myProfile.name,bio:myProfile.bio,avatar:myProfile.avatar||"",lastSeen:serverTimestamp()},{merge:true});localStorage.setItem("displayName",myProfile.name);profileModal.classList.add("hidden")}

settingsBtn.onclick=()=>{adminRoomRow.classList.toggle("hidden",!isAdmin);settingsModal.classList.remove("hidden")};closeSettings.onclick=()=>settingsModal.classList.add("hidden");
adminCodeBtn.onclick=async()=>{const c=prompt("管理者コードを入力");if(!c)return;if(await sha256(c)===ADMIN_CODE_HASH){isAdmin=true;localStorage.setItem("adminMode","1");adminRoomRow.classList.remove("hidden");alert("管理者モードになりました")}else alert("管理者コードが違います")}
renameRoomBtn.onclick=async()=>{if(!isAdmin)return;const n=prompt("新しいルーム名",roomName)?.trim().slice(0,40);if(!n)return;await setDoc(doc(db,"rooms",ROOM_ID,"config","main"),{roomName:n,updatedAt:serverTimestamp()},{merge:true})}
themeBtn.onclick=()=>{document.body.classList.toggle("light");localStorage.setItem("theme",document.body.classList.contains("light")?"light":"dark")};if(localStorage.getItem("theme")==="light")document.body.classList.add("light");
cacheBtn.onclick=()=>{if(!confirm("この端末の保存情報を消しますか？\n次回は名前入力からになります。"))return;localStorage.clear();sessionStorage.clear();location.reload()}
;[settingsModal,membersModal,profileModal].forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.add("hidden")});
if("serviceWorker"in navigator)navigator.serviceWorker.register("./firebase-messaging-sw.js").catch(()=>{});
</script>
</body>
</html>
