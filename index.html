<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>TelestgramDM</title>
  <style>
    :root {
      --bg:#080b12; --panel:#0e1320; --panel2:#151b2a; --panel3:#1b2335;
      --text:#f7f8fb; --muted:#98a2b3; --line:#253047; --accent:#6c7cff;
      --accent2:#7c5cff; --danger:#ff5d74; --ok:#55d58a; --bubble:#172033;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}
    .loginWrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:
      radial-gradient(circle at 20% 10%,rgba(108,124,255,.18),transparent 28%),
      radial-gradient(circle at 85% 0%,rgba(124,92,255,.12),transparent 24%),var(--bg)}
    .loginCard{width:min(460px,100%);background:rgba(14,19,32,.92);border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:0 24px 80px rgba(0,0,0,.28)}
    .logo{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:25px;font-weight:900;margin-bottom:16px}
    h1{margin:0 0 8px;font-size:30px} .desc{margin:0 0 20px;color:var(--muted);line-height:1.65}
    input[type="text"]{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:16px;padding:14px 15px;outline:none}
    input:focus{border-color:var(--accent)}
    .primary{width:100%;margin-top:12px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-weight:800;padding:14px}
    .tiny{font-size:12px;color:var(--muted);margin-top:10px}
    .app{min-height:100vh;display:flex;flex-direction:column}
    .topbar{height:72px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(8,11,18,.88);backdrop-filter:blur(16px)}
    .groupInfo{display:flex;align-items:center;gap:12px;min-width:0}
    .groupAvatar{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900}
    .groupText{min-width:0} .groupName{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .online{font-size:12px;color:var(--ok)}
    .topActions{display:flex;gap:8px;align-items:center}
    .iconBtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);display:grid;place-items:center;font-size:18px}
    .messages{flex:1;width:min(940px,100%);margin:0 auto;padding:18px 18px 130px;display:flex;flex-direction:column;gap:12px}
    .dayLine{align-self:center;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 10px}
    .msgRow{display:flex;gap:8px;max-width:80%;align-items:flex-end}
    .msgRow.mine{align-self:flex-end;flex-direction:row-reverse} .msgRow.other{align-self:flex-start}
    .miniAvatar{width:30px;height:30px;border-radius:10px;background:var(--panel3);display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 auto}
    .msgBlock{min-width:0}
    .sender{font-size:11px;color:var(--muted);margin:0 6px 4px}
    .msgRow.mine .sender{text-align:right}
    .bubbleWrap{display:flex;align-items:center;gap:6px}
    .msgRow.mine .bubbleWrap{flex-direction:row-reverse}
    .bubble{background:var(--bubble);border:1px solid var(--line);border-radius:18px;padding:10px 12px;line-height:1.48;word-break:break-word;overflow:hidden}
    .msgRow.mine .bubble{background:linear-gradient(135deg,#6577ff,#745cff);border-color:transparent}
    .meta{font-size:10px;color:var(--muted);margin-top:4px;padding:0 6px}
    .msgRow.mine .meta{text-align:right}
    .moreBtn{width:30px;height:30px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:18px}
    .moreBtn:hover{background:var(--panel2)}
    .composerShell{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(180deg,transparent,rgba(8,11,18,.96) 28%);padding:30px 12px 12px}
    .composer{width:min(940px,100%);margin:0 auto;border:1px solid var(--line);background:rgba(14,19,32,.96);border-radius:22px;padding:10px;display:flex;gap:8px;align-items:flex-end;box-shadow:0 16px 50px rgba(0,0,0,.28)}
    .attachGroup{display:flex;gap:6px}
    .toolBtn{width:42px;height:42px;border:0;border-radius:14px;background:var(--panel2);color:var(--text);font-size:18px;display:grid;place-items:center}
   
    .messageInput{flex:1;min-width:0;border:0;background:transparent;color:var(--text);padding:11px 8px;outline:none}
    .sendBtn{width:46px;height:46px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-weight:900;font-size:18px}
    .modalBack{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:50;display:grid;place-items:center;padding:18px}
    .modal{width:min(460px,100%);max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px}
    .modalHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .modalTitle{font-weight:900;font-size:20px} .closeBtn{width:38px;height:38px;border:0;border-radius:12px;background:var(--panel2);color:var(--text)}
    .settingRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
    .settingRow:last-child{border-bottom:0} .settingText b{display:block;margin-bottom:3px} .settingText span{font-size:12px;color:var(--muted)}
    .actionBtn{border:0;border-radius:12px;padding:10px 13px;background:var(--panel3);color:var(--text);font-weight:700}
    .actionBtn.danger{background:rgba(255,93,116,.14);color:#ff8798}
    .menu{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:160px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
    .menu button{width:100%;border:0;background:transparent;color:var(--text);text-align:left;padding:10px;border-radius:10px}
    .menu button:hover{background:var(--panel2)} .menu .danger{color:#ff8798}
    .empty{margin:auto;text-align:center;color:var(--muted);padding:50px}
    @media(max-width:680px){
      .messages{padding:14px 10px 125px} .msgRow{max-width:90%} .topbar{height:64px;padding:0 10px}
      .groupAvatar{width:40px;height:40px;border-radius:13px} .iconBtn{width:40px;height:40px}
      .composerShell{padding:24px 8px 8px} .composer{padding:8px;border-radius:19px} .toolBtn{width:40px;height:40px} .sendBtn{width:43px;height:43px}
    }
  </style>
</head>
<body>
<section id="login" class="loginWrap">
  <div class="loginCard">
    <div class="logo">T</div>
    <h1>TelestgramDM</h1>
    <p class="desc">みんなで使えるリアルタイムグループチャット。表示名だけで参加できます。</p>
    <form id="loginForm">
      <input id="nameInput" type="text" maxlength="24" placeholder="表示名を入力" required autocomplete="nickname">
      <button class="primary" type="submit">グループに参加</button>
      <div class="tiny">このURLを知っている人が同じグループに参加します。</div>
    </form>
  </div>
</section>

<section id="app" class="app hidden">
  <header class="topbar">
    <div class="groupInfo">
      <div class="groupAvatar">T</div>
      <div class="groupText">
        <div class="groupName">みんなのグループ</div>
        <div class="online">● リアルタイム接続中</div>
      </div>
    </div>
    <div class="topActions">
      <button id="notifyQuickBtn" class="iconBtn" type="button" title="通知">🔔</button>
      <button id="settingsBtn" class="iconBtn" type="button" title="設定">⚙️</button>
    </div>
  </header>

  <main id="messages" class="messages" aria-live="polite">
    <div class="empty">メッセージを読み込み中…</div>
  </main>

  <div class="composerShell">
    <form id="messageForm" class="composer">
      <input id="messageInput" class="messageInput" maxlength="1000" placeholder="メッセージ…" autocomplete="off">
      <button class="sendBtn" type="submit">➤</button>
    </form>
  </div>
</section>

<div id="settingsModal" class="modalBack hidden">
  <div class="modal">
    <div class="modalHeader">
      <div class="modalTitle">設定</div>
      <button id="closeSettings" class="closeBtn" type="button">✕</button>
    </div>
    <div class="settingRow">
      <div class="settingText"><b>通知</b><span>新しいメッセージの通知を許可します。</span></div>
      <button id="notifySettingBtn" class="actionBtn" type="button">通知をON</button>
    </div>
    <div class="settingRow">
      <div class="settingText"><b>キャッシュリセット</b><span>この端末だけの一時データを消して軽くします。グループのメッセージは消えません。</span></div>
      <button id="cacheResetBtn" class="actionBtn danger" type="button">リセット</button>
    </div>
  </div>
</div>

<div id="messageMenu" class="menu hidden">
  <button id="cancelMessageBtn" class="danger" type="button">送信を取り消す</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp,
  doc, updateDoc, deleteDoc, arrayUnion
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCrRzSomSPngvYviAjB8DdOSsw9ez0FVEg",
  authDomain: "telestgramdm.firebaseapp.com",
  projectId: "telestgramdm",
  storageBucket: "telestgramdm.firebasestorage.app",
  messagingSenderId: "705244166001",
  appId: "1:705244166001:web:1ca61eb8c3da30fb8528d0"
};

const VAPID_KEY = "BBCG75msNmK0UhdYRLucu2HvE3OKmQW_G5EMJovZqhLYVGc3ehhP23tLuNRuzAy7-u-Af7DlPHCuK4guyQLMGW8";
const ROOM_ID = "main-group";

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const $ = s => document.querySelector(s);
const login=$("#login"), app=$("#app"), loginForm=$("#loginForm"), nameInput=$("#nameInput"),
      messages=$("#messages"), messageForm=$("#messageForm"), messageInput=$("#messageInput"),
      settingsBtn=$("#settingsBtn"), settingsModal=$("#settingsModal"),
      closeSettings=$("#closeSettings"), notifyQuickBtn=$("#notifyQuickBtn"),
      notifySettingBtn=$("#notifySettingBtn"), cacheResetBtn=$("#cacheResetBtn"),
      messageMenu=$("#messageMenu"), cancelMessageBtn=$("#cancelMessageBtn");

let currentUser=null, displayName="", unsubscribe=null;
let selectedOwnMessage=null;
const renderedIds = new Set();

function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function initial(name){ return (name||"?").trim().slice(0,1).toUpperCase(); }
function timeText(ts){ try{ return ts?.toDate?.().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})||""; }catch{return""} }

function enterChat(user){
  currentUser=user;
  login.classList.add("hidden");
  app.classList.remove("hidden");
  startMessages();
  messageInput.focus();
}

loginForm.addEventListener("submit", async e=>{
  e.preventDefault();
  displayName=nameInput.value.trim().slice(0,24);
  if(!displayName) return alert("表示名を入力してください。");
  try{
    if(auth.currentUser) enterChat(auth.currentUser);
    else await signInAnonymously(auth);
  }catch(err){
    console.error(err);
    alert("参加できませんでした。Firebase設定を確認してください。");
  }
});

onAuthStateChanged(auth,user=>{
  if(!user) return;
  currentUser=user;
  if(displayName) enterChat(user);
});

function messageBody(m){
  return esc(m.text||"");
}

async function markRead(docId, m){
  if(!currentUser || m.uid===currentUser.uid) return;
  if(Array.isArray(m.readBy) && m.readBy.includes(currentUser.uid)) return;
  try{
    await updateDoc(doc(db,"rooms",ROOM_ID,"messages",docId), {
      readBy: arrayUnion(currentUser.uid)
    });
  }catch(err){ console.warn("read receipt failed",err); }
}

function renderMessage(docSnap){
  const m=docSnap.data();
  const mine=m.uid===currentUser?.uid;
  const row=document.createElement("div");
  row.className="msgRow "+(mine?"mine":"other");
  row.dataset.id=docSnap.id;

  const reads=Math.max(0,(m.readBy||[]).filter(x=>x!==m.uid).length);
  const readText = mine ? (reads>0 ? `既読 ${reads}` : "未読") : "";

  row.innerHTML=`
    <div class="miniAvatar">${esc(initial(m.name||"匿名"))}</div>
    <div class="msgBlock">
      <div class="sender">${esc(m.name||"匿名")}</div>
      <div class="bubbleWrap">
        <div class="bubble">${messageBody(m)}</div>
        ${mine ? '<button class="moreBtn" type="button" aria-label="メッセージ操作">⋯</button>' : ''}
      </div>
      <div class="meta">${timeText(m.createdAt)}${readText ? " ・ "+readText : ""}</div>
    </div>
  `;

  if(mine){
    const more=row.querySelector(".moreBtn");
    more.addEventListener("click",ev=>{
      ev.stopPropagation();
      selectedOwnMessage={
        id:docSnap.id
      };
      const r=more.getBoundingClientRect();
      messageMenu.style.left=Math.max(8,Math.min(window.innerWidth-175,r.left-130))+"px";
      messageMenu.style.top=Math.min(window.innerHeight-70,r.bottom+6)+"px";
      messageMenu.classList.remove("hidden");
    });
  }

  messages.appendChild(row);
  markRead(docSnap.id,m);
}

function startMessages(){
  if(unsubscribe) unsubscribe();
  const q=query(collection(db,"rooms",ROOM_ID,"messages"),orderBy("createdAt","asc"),limit(500));
  unsubscribe=onSnapshot(q,snap=>{
    messages.innerHTML="";
    if(snap.empty){
      messages.innerHTML='<div class="empty">まだメッセージはありません。最初に送ってみよう。</div>';
      return;
    }
    snap.forEach(renderMessage);
    window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
  },err=>{
    console.error(err);
    messages.innerHTML='<div class="empty">接続できません。Firebase設定を確認してください。</div>';
  });
}

messageForm.addEventListener("submit",async e=>{
  e.preventDefault();
  const text=messageInput.value.trim();
  if(!text||!currentUser) return;
  messageInput.value="";
  try{
    await addDoc(collection(db,"rooms",ROOM_ID,"messages"),{
      type:"text", text, name:displayName, uid:currentUser.uid,
      readBy:[currentUser.uid], createdAt:serverTimestamp()
    });
  }catch(err){
    console.error(err);
    alert("送信できませんでした。");
  }
});

document.addEventListener("click",()=>messageMenu.classList.add("hidden"));
messageMenu.addEventListener("click",e=>e.stopPropagation());
cancelMessageBtn.addEventListener("click",async()=>{
  if(!selectedOwnMessage) return;
  if(!confirm("このメッセージの送信を取り消しますか？")) return;
  try{
    await deleteDoc(doc(db,"rooms",ROOM_ID,"messages",selectedOwnMessage.id));
    messageMenu.classList.add("hidden");
  }catch(err){
    console.error(err);
    alert("送信を取り消せませんでした。");
  }
});

settingsBtn.addEventListener("click",()=>settingsModal.classList.remove("hidden"));
closeSettings.addEventListener("click",()=>settingsModal.classList.add("hidden"));
settingsModal.addEventListener("click",e=>{ if(e.target===settingsModal) settingsModal.classList.add("hidden"); });

async function enableNotifications(){
  if(!("Notification" in window)) return alert("このブラウザは通知に対応していません。");
  const permission=await Notification.requestPermission();
  if(permission!=="granted") return alert("通知が許可されませんでした。");
  try{
    const mod=await import("https://www.gstatic.com/firebasejs/12.4.0/firebase-messaging.js");
    const messaging=mod.getMessaging(firebaseApp);
    const reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js");
    await mod.getToken(messaging,{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
    notifySettingBtn.textContent="通知ON";
    notifyQuickBtn.textContent="🔔";
  }catch(err){
    console.error(err);
    alert("通知設定に失敗しました。");
  }
}
notifyQuickBtn.addEventListener("click",enableNotifications);
notifySettingBtn.addEventListener("click",enableNotifications);

cacheResetBtn.addEventListener("click",async()=>{
  if(!confirm("この端末のキャッシュをリセットしますか？\nグループのメッセージは消えません。")) return;
  try{
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    localStorage.clear();
    sessionStorage.clear();

    if(indexedDB.databases){
      const dbs=await indexedDB.databases();
      for(const d of dbs) if(d.name) indexedDB.deleteDatabase(d.name);
    }
  }catch(err){ console.warn(err); }
  location.reload();
});
</script>
</body>
</html>
